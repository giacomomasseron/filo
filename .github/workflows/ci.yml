name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} · Pest ${{ matrix.pest }}${{ matrix.deps == 'lowest' && ' · lowest deps' || '' }}${{ matrix.os != 'ubuntu-latest' && format(' · {0}', matrix.os) || '' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Each Pest major (Pest 2 runs on PHPUnit 10, 3 on 11, 4 on 12, 5 on 13)
        # runs on the oldest and the newest PHP it supports. 8.1 is a runtime
        # target but not a dev one: see the php81 job.
        include:
          - { os: ubuntu-latest,  php: '8.2', pest: '2', deps: lowest }
          - { os: ubuntu-latest,  php: '8.2', pest: '3' }
          - { os: ubuntu-latest,  php: '8.5', pest: '3' }
          - { os: ubuntu-latest,  php: '8.3', pest: '4' }
          - { os: ubuntu-latest,  php: '8.5', pest: '4' }
          - { os: ubuntu-latest,  php: '8.4', pest: '5' }
          - { os: ubuntu-latest,  php: '8.5', pest: '5' }
          - { os: windows-latest, php: '8.5', pest: '5' }
          - { os: macos-latest,   php: '8.5', pest: '5' }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: tokenizer
          ini-values: opcache.enable_cli=0
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (Pest ${{ matrix.pest }})
        run: |
          composer require --dev --no-update --no-interaction "pestphp/pest:^${{ matrix.pest }}.0"
          composer update --no-interaction --no-progress ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Lint
        run: |
          for f in src/*.php src/Testing/*.php src/Testing/*/*.php bootstrap.php bin/filo server/index.php; do php -l "$f"; done

      - name: Smoke test
        run: FILO_ENABLED=1 php -d opcache.enable_cli=0 examples/smoke.php

      - name: Test suite (filo enabled)
        run: FILO_ENABLED=1 php vendor/bin/pest --colors=always --log-junit junit.xml

      # Job logs need admin rights to download; annotations are public.
      - name: Annotate test failures
        if: failure()
        run: php .github/scripts/junit-annotations.php junit.xml

      - name: Unit tests without filo (assertions must fail loudly)
        run: php vendor/bin/pest --colors=always tests/Unit

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: filo-traces-php${{ matrix.php }}-pest${{ matrix.pest }}-${{ matrix.os }}
          path: .filo/traces/
          if-no-files-found: ignore

  php81:
    name: "PHP 8.1 (runtime only: lint + smoke)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: tokenizer
          ini-values: opcache.enable_cli=0
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint
        run: |
          for f in src/*.php src/Testing/*.php src/Testing/*/*.php bootstrap.php bin/filo server/index.php; do php -l "$f"; done

      # Runtime deps only: the dev tooling (Pest 2+, paratest) requires PHP >= 8.2,
      # and --no-dev still RESOLVES require-dev, so install from the lock instead.
      - name: Install runtime dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Smoke test
        run: FILO_ENABLED=1 php -d opcache.enable_cli=0 examples/smoke.php

  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: tokenizer
          coverage: none

      # The locked dev dependencies: the same PHPUnit/Pest the analysis sees locally.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress

  laravel:
    name: Laravel app on php -S (PHP 8.4, opcache on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: filo

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: tokenizer, pdo_sqlite
          coverage: none

      # Installed like a Packagist release (copied, not symlinked), so the
      # app sees the same vendor/giacomomasseron/filo layout users get.
      - name: Create a Laravel app that installs filo from this checkout
        run: |
          composer create-project laravel/laravel "$RUNNER_TEMP/app" --no-interaction --no-progress
          cd "$RUNNER_TEMP/app"
          composer config repositories.filo "{\"type\": \"path\", \"url\": \"$GITHUB_WORKSPACE/filo\", \"options\": {\"symlink\": false}}"
          composer require --dev "giacomomasseron/filo:*@dev" --no-interaction --no-progress

      - name: Serve traced and untraced requests
        run: php "$GITHUB_WORKSPACE/filo/.github/scripts/laravel-smoke.php" "$RUNNER_TEMP/app"
