name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.deps == 'lowest' && ' (lowest deps)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is a runtime target but not a dev one: Pest 2's lowest resolvable
        # set on 8.1 pins an advisory-blocked PHPUnit. See the php81 job.
        php: ['8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - php: '8.2'
            deps: lowest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: tokenizer
          ini-values: opcache.enable_cli=0
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint
        run: |
          for f in src/*.php src/Testing/*.php src/Testing/*/*.php bootstrap.php bin/filo server/index.php; do php -l "$f"; done

      - name: Smoke test
        run: FILO_ENABLED=1 php -d opcache.enable_cli=0 examples/smoke.php

      - name: Test suite (filo enabled)
        run: FILO_ENABLED=1 vendor/bin/pest --colors=always

      - name: Unit tests without filo (assertions must fail loudly)
        run: vendor/bin/pest --colors=always tests/Unit

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: filo-traces-php${{ matrix.php }}-${{ matrix.deps }}
          path: .filo/traces/
          if-no-files-found: ignore

  php81:
    name: "PHP 8.1 (runtime only: lint + smoke)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: tokenizer
          ini-values: opcache.enable_cli=0
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint
        run: |
          for f in src/*.php src/Testing/*.php src/Testing/*/*.php bootstrap.php bin/filo server/index.php; do php -l "$f"; done

      # Runtime deps only: the dev tooling (Pest 2, paratest) requires PHP >= 8.2,
      # and --no-dev still RESOLVES require-dev, so install from the lock instead.
      - name: Install runtime dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Smoke test
        run: FILO_ENABLED=1 php -d opcache.enable_cli=0 examples/smoke.php
